[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsfc"
version = "0.1.0"
description = "Reproduction of Yi et al. (IEEE TCYB 2026) input-constrained visual servoing formation control"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
